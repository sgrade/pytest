[project]
name = "python-exercises"
version = "0.1.0"
description = "A workspace for Python coding challenges and projects."
authors = [{ name = "sgrade" }]
requires-python = ">=3.13"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "sortedcontainers",
    "types-PyYAML",
    "fastapi[standard]",
]

[tool.uv]
link-mode = "copy"

# This tells setuptools "this isn't a real package, don't try to discover anything."
[tool.hatch.build.targets.wheel]
packages = []

[tool.ruff]
# Google Python Style Guide recommends 80 characters
line-length = 80
# Enable preview mode for additional formatting rules (like E302 blank lines)
preview = true

[tool.ruff.lint]
# Rules aligned with Google Python Style Guide.
# - E (pycodestyle errors): Code style violations including blank lines
# - F (Pyflakes): Catches errors like undefined names and unused imports
# - I (isort): Sorts imports automatically
# - N (pep8-naming): Naming conventions
# - UP (pyupgrade): Modern Python idioms
# - B (flake8-bugbear): Common bugs
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]
# LeetCode uses camelCase method names in problem statements
"leetcode/*" = [
    "N802",  # Function name should be lowercase (LeetCode uses camelCase)
    "N803",  # Argument name should be lowercase (LeetCode uses camelCase)
]
# Relaxed rules for Codeforces competitive programming
"codeforces/*" = [
    "F841",  # Unused local variable (common during debugging)
    "N802",  # Function name should be lowercase (allow camelCase)
    "N806",  # Allow UPPERCASE variables in functions (N, M, etc.)
]

[tool.ruff.format]
# Google Python Style Guide is flexible on quotes, but prefers consistency.
# Using double quotes for consistency with string literals in docstrings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending.
line-ending = "auto"
